name: Build

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build (Apple Silicon)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Cache Sparkle framework
        id: cache-sparkle
        uses: actions/cache@v4
        with:
          path: Carthage/Build/Mac/Sparkle.framework
          key: sparkle-2.6.4-mac-framework

      - name: Download Sparkle framework
        if: steps.cache-sparkle.outputs.cache-hit != 'true'
        run: |
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/Sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz"
          mkdir -p /tmp/sparkle-extract
          tar -xf /tmp/Sparkle.tar.xz -C /tmp/sparkle-extract
          SPARKLE_FW=$(find /tmp/sparkle-extract -name "Sparkle.framework" -path "*/macos*" | head -1)
          echo "Found framework at: $SPARKLE_FW"
          mkdir -p Carthage/Build/Mac
          cp -r "$SPARKLE_FW" Carthage/Build/Mac/

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Spectacle.xcodeproj \
            -scheme Spectacle \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty

      - name: Verify arm64 slice
        run: |
          BINARY="$RUNNER_TEMP/build/Release/Spectacle.app/Contents/MacOS/Spectacle"
          echo "Binary info:"
          lipo -info "$BINARY"
          lipo -info "$BINARY" | grep -q arm64 && echo "arm64 slice present" || (echo "arm64 slice MISSING" && exit 1)
