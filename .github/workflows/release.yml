name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Cache Sparkle framework
        id: cache-sparkle
        uses: actions/cache@v4
        with:
          path: Carthage/Build/Mac/Sparkle.framework
          key: sparkle-2.6.4-mac-framework

      - name: Download Sparkle framework
        if: steps.cache-sparkle.outputs.cache-hit != 'true'
        run: |
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o /tmp/Sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz"
          mkdir -p /tmp/sparkle-extract
          tar -xf /tmp/Sparkle.tar.xz -C /tmp/sparkle-extract
          find /tmp/sparkle-extract -maxdepth 3 -type d | head -20
          SPARKLE_FW=$(find /tmp/sparkle-extract -name "Sparkle.framework" | head -1)
          echo "Found framework at: $SPARKLE_FW"
          if [ -z "$SPARKLE_FW" ]; then
            echo "ERROR: Sparkle.framework not found in extracted archive"
            exit 1
          fi
          mkdir -p Carthage/Build/Mac
          cp -r "$SPARKLE_FW" Carthage/Build/Mac/

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "Spectacle/Supporting Files/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "Spectacle/Supporting Files/Info.plist"
          echo "Building version $VERSION"

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project Spectacle.xcodeproj \
            -scheme Spectacle \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/build" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build \
            | xcpretty

      - name: Embed Sparkle framework
        run: |
          APP="$RUNNER_TEMP/build/Release/Spectacle.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"
          cp -r Carthage/Build/Mac/Sparkle.framework "$FRAMEWORKS/"
          echo "Embedded frameworks:"
          ls "$FRAMEWORKS/"

      - name: Ad-hoc codesign
        run: |
          APP="$RUNNER_TEMP/build/Release/Spectacle.app"
          # Sign nested code (frameworks, helpers) before the outer bundle
          find "$APP/Contents/Frameworks" -name "*.framework" | while read fw; do
            codesign --force --sign "-" "$fw"
          done
          codesign --force --deep --sign "-" "$APP"
          echo "Codesign info:"
          codesign -dv "$APP" 2>&1 || true

      - name: Verify universal binary
        run: |
          BINARY="$RUNNER_TEMP/build/Release/Spectacle.app/Contents/MacOS/Spectacle"
          echo "Binary architectures:"
          lipo -info "$BINARY"
          lipo -info "$BINARY" | grep -q arm64 && echo "arm64 slice present" || (echo "arm64 slice MISSING" && exit 1)

      - name: Package
        run: |
          cd "$RUNNER_TEMP/build/Release"
          ditto -c -k --keepParent Spectacle.app "$RUNNER_TEMP/Spectacle-${GITHUB_REF_NAME}.zip"
          echo "Package size: $(du -sh $RUNNER_TEMP/Spectacle-${GITHUB_REF_NAME}.zip | cut -f1)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/Spectacle-${GITHUB_REF_NAME}.zip#Spectacle-${GITHUB_REF_NAME}.zip" \
            --title "Spectacle ${GITHUB_REF_NAME}" \
            --notes "## Spectacle ${GITHUB_REF_NAME} — Apple Silicon Build

Native arm64 support (no Rosetta required). Universal binary runs on both Apple Silicon and Intel Macs.

### Install
1. Download and unzip \`Spectacle-${GITHUB_REF_NAME}.zip\`
2. Move \`Spectacle.app\` to \`/Applications\`
3. **First launch only:** right-click → Open to bypass the Gatekeeper warning

> This build is ad-hoc signed (not notarized). macOS shows a security prompt on the very first launch — right-clicking and choosing Open bypasses it permanently.

### System Requirements
- macOS 10.13 High Sierra or later
- Apple Silicon (M-series) or Intel Mac

### Changes from the original Spectacle
- Native arm64 binary — no Rosetta 2 required
- Sparkle updated to 2.x (also arm64-native)
- Minimum macOS raised from 10.9 to 10.13"
